<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>WebM Character Loop Control</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  /* 화면 중앙에 16:9 스테이지 배치 */
  .stage-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    transform: translate(-50%, -50%);
  }

  /* 실제 1920×1080 스테이지 */
  .stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    background-image: url("web.ch_test.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* 캐릭터 */
  .anim-wrapper {
    position: absolute;
    width: 254px;
    height: 653px;
    left: 50%;
    top: 200px;
    transform: translateX(-50%);
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
  }

  /* 버튼 */
  .btns {
    position: absolute;
    left: 50%;
    top: 900px;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
  }

  button {
    padding: 12px 24px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #333;
    color: #fff;
    cursor: pointer;
  }

  #btn_idle { background: #3a6df0; }
  #btn_speaking { background: #e44d26; }
</style>
</head>

<body>

<div class="stage-wrapper" id="stageWrapper">
  <div class="stage">

    <div class="anim-wrapper">
      <video id="char" autoplay muted playsinline>
        <source src="ch1_anim.webm" type="video/webm">
      </video>
    </div>

    <div class="btns">
      <button id="btn_idle">Idle</button>
      <button id="btn_speaking">Speaking</button>
    </div>

  </div>
</div>

<script>
/* ====== 1) 고정 비율 스케일링 ====== */
function resizeStage() {
  const wrapper = document.getElementById("stageWrapper");

  const targetW = 1920;
  const targetH = 1080;
  const ww = window.innerWidth;
  const wh = window.innerHeight;

  const scale = Math.min(ww / targetW, wh / targetH);

  wrapper.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', resizeStage);
resizeStage();

/* ====== 2) webm 구간 루프 ====== */
const FPS = 30;
const idleRange  = { start: 0,  end: 44 };
const speakRange = { start: 44, end: 165 };

const toTime = f => f / FPS;

const video = document.getElementById("char");
let currentRange = idleRange;

function setRange(r) {
  currentRange = r;
  video.currentTime = toTime(r.start);
  if (video.paused) video.play();
}

function loopCheck() {
  if (video.readyState >= 2) {
    if (video.currentTime >= toTime(currentRange.end)) {
      video.currentTime = toTime(currentRange.start);
    }
  }
  requestAnimationFrame(loopCheck);
}

video.addEventListener("loadedmetadata", () => {
  setRange(idleRange);
  video.play();
  loopCheck();
});

document.getElementById("btn_idle").onclick = () => setRange(idleRange);
document.getElementById("btn_speaking").onclick = () => setRange(speakRange);

</script>

</body>
</html>
